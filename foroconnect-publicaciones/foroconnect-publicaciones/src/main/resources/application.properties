
spring.application.name=foroconnect-publicaciones

# PUERTO DEL SEGUNDO MICROSERVICIO
server.port=8082

# CONEXION A ORACLE
spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/FREEPDB1
spring.datasource.username=FOROCONNECT
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# CONFIGURACION JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
usuarios.service.url=http://localhost:8081